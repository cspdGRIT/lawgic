services:
  - type: web
    name: lawgic-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false          # set this manually in the Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
      - key: CORS_ORIGINS
        sync: false          # set to your Vercel URL, e.g. https://lawgic.vercel.app
      - key: LLM_PROVIDER
        value: anthropic
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: LLM_CACHE_TTL_SECONDS
        value: "3600"
