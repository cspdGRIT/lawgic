services:
  - type: web
    name: lawgic-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false          # set this manually in the Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false           # optional — only needed if you switch LLM_PROVIDER back to anthropic
      - key: GROQ_API_KEY
        sync: false           # set this manually in the Render dashboard — free key at console.groq.com
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
      - key: CORS_ORIGINS
        sync: false          # set to your Vercel URL, e.g. https://lawgic.vercel.app
      - key: LLM_PROVIDER
        value: groq           # open-weight models (Llama 3.3 70B) via Groq's free tier — see backend/.env.example
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: LLM_CACHE_TTL_SECONDS
        value: "3600"
      - key: UPI_VPA
        sync: false          # set this manually in the Render dashboard — never commit a real one
      - key: UPI_PAYEE_NAME
        value: Lawgic
      # The following are all currently unset in production, so these features are
      # dormant (each has a working fallback — see backend/.env.example for details):
      - key: NOTIFY_PROVIDER
        sync: false          # unset here -> defaults to "console" (logs only, no real email sent).
                              # Set to "smtp" + the SMTP_* vars below to actually deliver deadline-reminder emails.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false          # unset -> /pricing "Upgrade" is disabled, /create-order returns 501
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false          # unset -> Google sign-in button is hidden entirely
      - key: INDIAN_KANOON_API_KEY
        sync: false          # unset -> Legal Research uses the local knowledge base only
