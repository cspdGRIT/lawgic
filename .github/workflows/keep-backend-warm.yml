name: Keep backend warm

# Render's free plan spins the container down after ~15 minutes with no inbound
# traffic; the next real visitor then eats a 30-60s cold start before anything
# responds — directly hurts "blazing fast" and makes signup feel broken on a first
# visit. This is a free stopgap (public repo = unlimited Actions minutes): ping
# /health often enough that the service never sees 15 idle minutes. The real fix is
# upgrading the Render plan off free (see frontend/MOBILE_PUBLISHING.md-adjacent
# notes) — this just buys back the free-tier user experience in the meantime.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # The ping itself is often what wakes a spun-down container — a single attempt
      # with a tight timeout fails hard on exactly the cold starts this workflow
      # exists to paper over (measured one at 52s; GitHub Actions' default shell runs
      # with `set -e`, so curl timing out used to kill the step before it even got to
      # log anything). Retry through the cold start instead of treating it as failure.
      - name: Ping health endpoint (retrying through a cold start)
        run: |
          url="https://lawgic-qy66.onrender.com/health"
          for attempt in 1 2 3 4; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 100 "$url" || echo "000")
            echo "attempt $attempt -> HTTP $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Backend health check failed after 4 attempts (last status: $status)"
          exit 1
